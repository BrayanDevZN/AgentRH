services:
  redis:
    image: redis:alpine
    ports:
      - "6350:6379"

  migration:
    build:
      context: ../..
      dockerfile: src/controller/images/Dockerfile.migration
    command: ["python", "-m", "src.service.db.migration", "make_migration_tables"]

    


  api-agent:
    ports:
      - "650:8000"
    build:
      context: ../..
      dockerfile: src/controller/images/Dockerfile.api
    depends_on:
      - redis
      - migration

    command: ["python", "-m", "uvicorn", "src.aplication.main:app","--host", "0.0.0.0","--port", "8000", "--reload"]

  agent:
    build:
      context: ../..
      dockerfile: src/controller/images/Dockerfile.worker


    depends_on:
      - redis
      - api-agent
      - migration

    
    

    

  
     


  
