x-app-environment: &app-environment
  redis_port: "6379"
  redis_host: "redis"
  url: "${url}"
  sing: "${sing}"
  origin: "${origin}"
  rate_limit: "${rate_limit}"
  global_rate_limit: "${global_rate_limit}"
  email_user: "${email_user}"
  password_user: "${password_user}"
  open_ai_key: "${open_ai_key}"
  environment: "${environment}"

services:
  redis:
    image: redis:alpine
    ports:
      - "6350:6379"

  migration:
    environment: *app-environment
    image: brayandevzn/agent_rh:migration-v1
    build:
      context: ../..
      dockerfile: src/controller/images/Dockerfile.migration
    
    depends_on:
      - redis
  


  api-agent:
    environment: *app-environment
    image: brayandevzn/agent_rh:api-v1
    ports:
      - "650:8000"
    build:
      context: ../..
      dockerfile: src/controller/images/Dockerfile.api
    depends_on:
      - redis
      - migration

   
  agent:
    image: brayandevzn/agent_rh:agent-v1
    environment: *app-environment
    build:
      context: ../..
      dockerfile: src/controller/images/Dockerfile.worker


    depends_on:
      - redis
      - api-agent
      - migration

    
    

    

  
     


  
