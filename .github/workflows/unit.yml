name: unit

on: 
    push:
        branches:
            - main
            - develop

    pull_request:
        branches:
            - main
            - develop



jobs:

    ambient:

        runs-on: ubuntu-latest
        environment: develop

        steps:

            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: "3.14"

            - run: python -m tests.unit.logs
            - run: pip install python-dotenv
            - run: python -m tests.unit.config



