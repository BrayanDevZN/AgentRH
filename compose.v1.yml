x-app_config: &app_config
  env_file:
    - src/config/core/.env



services:

  redis:
    image: redis:alpine
    
  migration:
    <<: *app_config
    image: brayandevzn/agent_rh:migration-v1
    depends_on:
      - redis

    ports:
      - 800:8050

  
  agent:
    <<: *app_config
    image: brayandevzn/agent_rh:agent-v1
    depends_on:
      - migration
      - redis

  api-agent:
    <<: *app_config
    image: brayandevzn/agent_rh:api-v1
    ports:
      - 8000:8000

   
    depends_on:
      - redis
      - migration
      - agent

    

    

  


